# Publicação da página de vendas do Balconista (Netlify).
# A página é feita só de arquivos (HTML, CSS, JS e imagens): não tem "build", o Netlify publica a pasta como está.
# Cada alteração enviada para o GitHub gera um link de prévia; só vai para balconista.app.br quando entra na branch main.

[build]
  publish = "."

# Cabeçalhos de segurança (os mesmos que davam nota A no securityheaders.com).
# Se for usar algo de outro site (vídeo do YouTube, Google Analytics, Pixel...), o endereço precisa ser liberado aqui,
# na linha Content-Security-Policy. Peça ajuda antes de mexer.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self' https://painel.balconista.app.br; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), display-capture=(), usb=(), serial=(), hid=(), midi=(), accelerometer=(), gyroscope=(), magnetometer=(), browsing-topics=()"

# Imagens e ícones ficam guardados no navegador por 1 dia; a página e o script sempre vêm atualizados
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Fontes da página (Geist), hospedadas aqui mesmo: também 1 dia no navegador
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Endereços antigos que alguém possa ter salvo
[[redirects]]
  from = "/entrar"
  to = "https://painel.balconista.app.br/entrar"
  status = 301
[[redirects]]
  from = "/criar-conta"
  to = "https://painel.balconista.app.br/criar-conta"
  status = 301
[[redirects]]
  from = "/termos"
  to = "https://painel.balconista.app.br/termos"
  status = 301
[[redirects]]
  from = "/privacidade"
  to = "https://painel.balconista.app.br/termos#privacidade"
  status = 301
